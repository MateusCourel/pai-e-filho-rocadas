<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Entrar | Painel Pai e Filho Roçadas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="bg-verde d-flex align-items-center min-vh-100">
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-9 col-md-6 col-lg-4">
        <div class="card shadow">
          <div class="card-body p-4">
            <h1 class="h4 fw-bold text-center mb-1"><i class="bi bi-tree-fill text-verde"></i> Painel</h1>
            <p class="text-center text-muted small mb-4">Pai e Filho Roçadas — acesso restrito</p>
            <form id="formLogin">
              <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" id="email" class="form-control" required autocomplete="username">
              </div>
              <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" id="senha" class="form-control" required autocomplete="current-password">
              </div>
              <div id="erro" class="alert alert-danger py-2 small d-none"></div>
              <button class="btn btn-verde w-100" type="submit">Entrar</button>
            </form>
            <a href="../index.html" class="d-block text-center small mt-3">← Voltar ao site</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script>
    // Já logado? vai direto pro painel
    db.auth.getSession().then(({ data }) => { if (data.session) location.href = "index.html"; });

    document.getElementById("formLogin").addEventListener("submit", async (e) => {
      e.preventDefault();
      const erro = document.getElementById("erro");
      erro.classList.add("d-none");
      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("senha").value,
      });
      if (error) {
        erro.textContent = "E-mail ou senha inválidos.";
        erro.classList.remove("d-none");
      } else {
        location.href = "index.html";
      }
    });
  </script>
</body>
</html>
